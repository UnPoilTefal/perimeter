name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Le kit s'applique a son propre corpus d'exemple : une regression de regle
  # casse la CI avant d'atteindre un corpus reel.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Binaire compile plutot que « go run » : ce dernier ne propage pas le
      # code de sortie du programme, il sort en 1 quel qu'il soit — ce qui
      # rendrait invisible la verification des verdicts ci-dessous.
      - run: go build -o bin/perctl ./cmd/perctl

      # Le corpus est resolu depuis le registre : une equipe n'ecrit qu'un fichier.
      - run: ./bin/perctl lint --perimeter examples/perimeter.yml --format github --strict
      # L'usage ad hoc, sur un repertoire hors de tout perimetre declare.
      - run: ./bin/perctl lint examples/corpus --strict
      # En regime authored, « index --sync » doit refuser ET ne rien ecrire.
      # Taire index-drift sans desarmer la commande laisserait la config dire
      # une chose et l'outil rester capable du contraire.
      - name: index --sync refuse en regime authored
        run: |
          cp examples/perimeter.yml /tmp/authored.yml
          python3 - <<'PY'
          s = open('/tmp/authored.yml').read()
          s = s.replace('      index: MEMORY.md', '      index: MEMORY.md\n      index_hook: authored', 1)
          open('/tmp/authored.yml', 'w').write(s)
          PY
          avant=$(git status --porcelain examples/ | wc -l)
          if ./bin/perctl index --sync --perimeter /tmp/authored.yml; then
            echo "::error::index --sync aurait du refuser en regime authored"
            exit 1
          fi
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::index --sync a modifie l'index alors qu'il refusait"
            exit 1
          fi
          # En derived, la commande reste operante.
          ./bin/perctl index --sync --perimeter examples/perimeter.yml > /dev/null
          git checkout -- examples/

      # Un controle qui atteint tout le corpus est un fait de processus, pas
      # N faits de notes : il doit se replier en un constat portant sa
      # remediation, et surtout laisser les autres controles visibles — c'est
      # le fond de #58, ou 82 index-drift releguaient 24 atomicity hors de
      # l'ecran. Le complement est verifie dans le meme mouvement : sur le
      # meme corpus, une minorite qui derive garde son detail par note, parce
      # que c'est alors l'identite des notes qui est l'information.
      - name: un controle total se replie, une minorite garde son detail
        run: |
          set -euo pipefail
          corpus=/tmp/agregation
          # Douze notes : au-dessus du plancher de repli, et assez pour que la
          # difference entre les deux regimes soit lisible. Trois depassent le
          # budget de mots — c'est le second controle, celui qui doit survivre
          # au repli du premier.
          gabarit() { # $1 = nombre d'accroches redigees a la main (donc en derive)
            rm -rf "$corpus" && mkdir -p "$corpus"
            printf '# Index\n\n' > "$corpus/MEMORY.md"
            for i in $(seq 0 11); do
              n=$(printf 'reference-note-%02d' "$i")
              desc="Le fait numero $i, enonce assez precisement pour decider du rappel"
              corps="Un fait."
              [ "$i" -lt 3 ] && corps=$(python3 -c "print('mot '*500)")
              cat > "$corpus/$n.md" <<NOTE
          ---
          name: $n
          description: "$desc"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          $corps
          NOTE
              accroche="$desc"
              [ "$i" -lt "$1" ] && accroche="reformule a la main pour l'humain qui parcourt ($i)"
              printf -- '- [Reference: note %02d](%s.md) — %s\n' "$i" "$n" "$accroche" >> "$corpus/MEMORY.md"
            done
          }

          # 12/12 : un constat, sa mesure, sa remediation.
          gabarit 12
          total=$(./bin/perctl lint "$corpus" || true)
          case "$total" in
            *"index-drift : l'index n'est pas synchronise (12/12 notes)"*) ;;
            *) echo "::error::12/12 aurait du rendre un constat de processus"; echo "$total"; exit 1 ;;
          esac
          case "$total" in
            *"perctl index --sync"*) ;;
            *) echo "::error::le constat de processus ne porte pas sa remediation"; echo "$total"; exit 1 ;;
          esac
          # Le detail par note a disparu de la sortie standard...
          if [ "$(printf '%s\n' "$total" | grep -c "l'accroche ne reprend pas")" -ne 0 ]; then
            echo "::error::le detail par note aurait du se replier"; echo "$total"; exit 1
          fi
          # ...mais « --verbose » le rend, entier.
          if [ "$(./bin/perctl lint "$corpus" --verbose | grep -c "l'accroche ne reprend pas")" -ne 12 ]; then
            echo "::error::--verbose doit rendre les 12 lignes de detail"; exit 1
          fi
          # Et surtout : l'autre controle est reste visible. C'est le defaut
          # rapporte — le plus bruyant emportait le plus utile.
          if [ "$(printf '%s\n' "$total" | grep -c 'mots (budget 400)')" -ne 3 ]; then
            echo "::error::atomicity a ete emporte par le repli d'index-drift"; echo "$total"; exit 1
          fi

          # 2/12 : sous le seuil, l'identite des notes est l'information.
          gabarit 2
          minorite=$(./bin/perctl lint "$corpus" || true)
          if [ "$(printf '%s\n' "$minorite" | grep -c "l'accroche ne reprend pas")" -ne 2 ]; then
            echo "::error::une minorite doit garder son detail par note"; echo "$minorite"; exit 1
          fi
          case "$minorite" in
            *"constat de processus"*) echo "::error::une minorite ne se replie pas"; echo "$minorite"; exit 1 ;;
          esac
          echo "  ✓ 12/12 replie avec sa remediation, 2/12 detaille, atomicity intact"

      # Le repli ne doit jamais suggerer une commande que la politique du
      # corpus refuse. En regime authored « index --sync » refuse d'ecrire :
      # index-drift ne s'y declenche pas, et aucun format de sortie ne doit
      # le proposer. Le meme corpus est d'abord passe en derived — sans quoi
      # la garde serait verte pour la mauvaise raison, un corpus qui ne
      # derive pas prouvant seulement qu'il ne derive pas.
      - name: en regime authored, aucune remediation index --sync n'est suggeree
        run: |
          set -euo pipefail
          # Reprend le corpus de l'etape precedente : douze accroches redigees
          # a la main, donc douze derives en regime derived.
          corpus=/tmp/agregation-authored
          rm -rf "$corpus" && mkdir -p "$corpus"
          printf '# Index\n\n' > "$corpus/MEMORY.md"
          for i in $(seq 0 11); do
            n=$(printf 'reference-note-%02d' "$i")
            # Trois notes hors budget : un constat qui survit au regime
            # authored, donc un temoin que le corpus a bien ete lu.
            corps="Un fait."
            [ "$i" -lt 3 ] && corps=$(python3 -c "print('mot '*500)")
            cat > "$corpus/$n.md" <<NOTE
          ---
          name: $n
          description: "Le fait numero $i, enonce assez precisement pour decider du rappel"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          $corps
          NOTE
            printf -- '- [Reference: note %02d](%s.md) — accroche redigee a la main (%d)\n' "$i" "$n" "$i" >> "$corpus/MEMORY.md"
          done

          cat > /tmp/authored-lint.yml <<YML
          version: 1
          roles:
            contrainte.memoire: { source: memoire }
          sources:
            memoire:
              adapter: files
              endpoint: $corpus
              reliability: declared
              probe: { cmd: "true" }
              corpus:
                index: MEMORY.md
                index_hook: authored
          YML

          # En derived — le defaut, sans registre — la remediation est la.
          derive=$(./bin/perctl lint "$corpus" || true)
          case "$derive" in
            *"perctl index --sync"*) ;;
            *) echo "::error::le corpus temoin ne derive pas : la garde suivante ne prouverait rien"; echo "$derive"; exit 1 ;;
          esac

          # En authored, aucun format ne doit la proposer.
          for f in human json github; do
            sortie=$(./bin/perctl lint --perimeter /tmp/authored-lint.yml --format "$f" || true)
            case "$sortie" in
              *"index --sync"*) echo "::error::format $f : une commande refusee par la politique est suggeree"; echo "$sortie"; exit 1 ;;
            esac
            # Et le corpus a bien ete lu : sans cela, le silence ci-dessus
            # serait celui d'un corpus introuvable.
            case "$sortie" in
              *"budget 400"*|*'"notes": 12'*) ;;
              *) echo "::error::format $f : le corpus n'a pas ete lu"; echo "$sortie"; exit 1 ;;
            esac
          done
          echo "  ✓ derive suggere index --sync, authored ne le suggere dans aucun format"

      # Une note sans date doit bloquer par defaut, et retomber en simple
      # avertissement quand le corpus le declare. Sans le premier, le trou se
      # reforme ; sans le second, un corpus existant n'a aucune porte de sortie.
      - name: une note sans date est une erreur, sauf declaration contraire
        run: |
          mkdir -p /tmp/sansdate
          cat > /tmp/sansdate/MEMORY.md <<'MD'
          # Index

          - [Reference: sans date](reference-sans-date.md) — rien ne la rattache au temps
          MD
          cat > /tmp/sansdate/reference-sans-date.md <<'MD'
          ---
          name: reference-sans-date
          description: "Un fait parfaitement enonce, mais que rien ne permet de faire vieillir"
          metadata:
            type: reference
          ---

          Un fait.
          MD
          if ./bin/perctl lint /tmp/sansdate; then
            echo "::error::une note sans date aurait du etre une erreur"
            exit 1
          fi

      # « draft » juge un brouillon et n'ecrit jamais — ni le brouillon, ni le
      # corpus. C'est la contrainte dure du portillon : des propositions
      # relues, pas des ecritures.
      - name: draft ne modifie rien et bloque sur collision
        run: |
          avant=$(git status --porcelain examples/ | wc -l)
          cat > /tmp/brouillon.md <<'MD'
          ---
          name: reference-tout-nouveau
          description: "Un fait entierement nouveau, enonce assez precisement pour etre jugeable"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          Un fait.
          MD
          ./bin/perctl draft /tmp/brouillon.md --perimeter examples/perimeter.yml
          # Un nom deja pris doit bloquer : sinon le fichier ecrase une note.
          existante=$(ls examples/corpus/*.md | grep -v MEMORY | head -1 | xargs basename | sed 's/\.md$//')
          sed "s/reference-tout-nouveau/$existante/" /tmp/brouillon.md > /tmp/collision.md
          if ./bin/perctl draft /tmp/collision.md --perimeter examples/perimeter.yml; then
            echo "::error::draft aurait du bloquer sur une collision de nom"
            exit 1
          fi
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::draft a modifie le corpus"
            exit 1
          fi

      # « draft » sans argument lit l'entree standard. Deux usages s'y croisent
      # et demandent l'inverse l'un de l'autre : en pipe il ne doit rien
      # ajouter — la sortie est peut-etre redirigee ; au clavier il doit dire
      # ce qu'il attend, sinon il parait fige et le reflexe est Ctrl-C.
      - name: draft annonce l'attente au clavier, et se tait en pipe
        run: |
          cat > /tmp/stdin-brouillon.md <<'MD'
          ---
          name: reference-lu-sur-stdin
          description: "Un fait entierement nouveau, enonce assez precisement pour etre jugeable"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          Un fait.
          MD
          # stdin non-tty : le verdict sur stdout, et rien du tout sur stderr.
          ./bin/perctl draft --perimeter examples/perimeter.yml \
            < /tmp/stdin-brouillon.md > /tmp/draft-pipe.out 2> /tmp/draft-pipe.err
          if [ -s /tmp/draft-pipe.err ]; then
            echo "::error::stdin redirige : stderr doit rester vide, obtenu $(cat /tmp/draft-pipe.err)"
            exit 1
          fi
          if ! grep -q '^brouillon' /tmp/draft-pipe.out; then
            echo "::error::le verdict a disparu de la sortie standard"
            exit 1
          fi
          # stdin tty : un vrai terminal demande un pty, « script » en alloue
          # un. L'entree est vide, donc la commande sortira en erreur — ce qui
          # compte est que l'annonce soit deja la quand le Ctrl-D arrive.
          script -q -c "./bin/perctl draft --perimeter examples/perimeter.yml" \
            /tmp/draft-tty.txt < /dev/null > /dev/null 2>&1 || true
          if ! grep -q "Ctrl-D pour juger" /tmp/draft-tty.txt; then
            echo "::error::stdin tty : l'attente n'est pas annoncee — $(cat /tmp/draft-tty.txt)"
            exit 1
          fi

      # Le parcours d'un nouvel utilisateur : init dans un dossier vide, puis
      # les premieres commandes. C'est ce chemin qui a produit les defauts
      # remontes de l'exterieur — aucune verification ne le prenait, parce
      # qu'elles partent toutes d'un perimetre deja configure.
      - name: le premier contact ne rend pas d'erreur brute
        run: |
          mkdir -p /tmp/neuf && cd /tmp/neuf
          "$GITHUB_WORKSPACE/bin/perctl" init < /dev/null > /dev/null
          # Le corpus declare n'existe pas encore : le message doit nommer la
          # source et le role, pas rendre un « lstat: no such file ».
          sortie=$("$GITHUB_WORKSPACE/bin/perctl" lint 2>&1 || true)
          for attendu in "contrainte.memoire" "corriger son endpoint"; do
            case "$sortie" in
              *"$attendu"*) ;;
              *) echo "::error::le diagnostic ne cite pas $attendu : $sortie"; exit 1 ;;
            esac
          done
          case "$sortie" in
            *lstat*) echo "::error::l'erreur brute de la bibliotheque remonte encore"; exit 1 ;;
          esac
          # Un endpoint qui n'est pas un depot git doit etre nomme comme tel.
          mkdir -p memory && printf '# Index\n' > memory/MEMORY.md
          sortie=$("$GITHUB_WORKSPACE/bin/perctl" harvest --allow-exec 2>&1 || true)
          case "$sortie" in
            *"exit status"*) echo "::error::le code de sortie de git remonte brut : $sortie"; exit 1 ;;
          esac

      # Un chemin et un --perimeter se combinent : le meme corpus doit rendre
      # le meme verdict, qu'il soit designe par le registre ou par un chemin.
      # Les accepter puis en ignorer un rendait « lint <chemin> » et « lint »
      # divergents sur le meme corpus, sans rien dire.
      - name: un chemin positionnel n'ecarte pas --perimeter
        run: |
          avec=$(./bin/perctl lint examples/corpus --perimeter examples/perimeter.yml 2>/dev/null | tail -1)
          sans=$(./bin/perctl lint --perimeter examples/perimeter.yml 2>/dev/null | tail -1)
          if [ "$avec" != "$sans" ]; then
            echo "::error::verdicts divergents — avec chemin: $avec / sans: $sans"
            exit 1
          fi

      # Le registre doit etre adressable autrement que par --perimeter : une
      # session d'agent ou un job de CI exporte une variable plus facilement
      # qu'il ne passe un chemin a chaque commande.
      - name: le registre se resout par PERIMETER, et un chemin absent se signale
        run: |
          cd /tmp
          if PERIMETER="$GITHUB_WORKSPACE/examples/perimeter.yml" "$GITHUB_WORKSPACE/bin/perctl" lint --strict; then
            echo "resolution par PERIMETER : ok"
          else
            echo "::error::PERIMETER n'a pas resolu le registre"
            exit 1
          fi
          if PERIMETER=/tmp/nexiste-pas.yml "$GITHUB_WORKSPACE/bin/perctl" lint 2>/dev/null; then
            echo "::error::un PERIMETER pointant un fichier absent doit etre signale, pas ignore"
            exit 1
          fi

      # « perimeter » est la sous-commande dont le metier est d'inspecter le
      # registre, et c'etait la seule a ne pas savoir le trouver : elle ouvrait
      # perimeter.yml dans le repertoire courant pendant que lint et verify
      # empruntaient l'ordre de resolution ci-dessus (#66). La regression de
      # parcours etait silencieuse — ramener un registre a l'emplacement par
      # defaut, donc retirer la variable, laissait lint marcher et arretait
      # perimeter, sans que rien n'annonce que les deux ne se resolvent pas
      # pareil.
      #
      # La garde ne se contente donc pas de constater que la commande trouve
      # *un* registre : elle compare celui qu'elle retient a celui de lint.
      # Chaque registre pilote le corpus pose a cote de lui, ce qui rend le
      # choix de lint lisible dans le « root » de sa sortie JSON. Et deux
      # registres repondent dans le second cas — un par remontee, un a
      # l'emplacement utilisateur : avec un seul candidat, une implementation
      # qui ne consulterait que l'emplacement utilisateur serait verte.
      - name: perimeter resout le registre comme lint
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/bin/perctl"
          base=$(mktemp -d)

          poser() { # $1 = repertoire qui portera le registre, a cote de son corpus
            mkdir -p "$1/memoire"
            printf '# Index\n\n- [Reference: un](reference-un.md) — accroche redigee a la main\n' > "$1/memoire/MEMORY.md"
            cat > "$1/memoire/reference-un.md" <<'NOTE'
          ---
          name: reference-un
          description: "Le port 9 de l'UDM Pro est le WAN2, indiscernable d'un port LAN libre"
          metadata:
            type: reference
            modified: 2026-09-15
          ---

          Un fait.
          NOTE
            cat > "$1/perimeter.yml" <<YML
          version: 1
          roles:
            intention.spec:       { source: m }
            intention.tickets:    { source: m }
            contrainte.decisions: { source: m }
            contrainte.memoire:   { source: m }
            etat.declare:         { source: m }
            etat.reel:            { source: m }
          sources:
            m:
              adapter: files
              reliability: declared
              endpoint: "$1/memoire"
              probe: { cmd: "true" }
              corpus:
                index: MEMORY.md
                index_hook: authored
          YML
          }

          # Les deux tolerent l'echec : un registre introuvable doit rendre le
          # constat explicite plus bas, pas interrompre l'etape sans rien dire.
          registreDeLint() {
            { "$bin" lint --format json 2>/dev/null || true; } | python3 -c \
              'import json,os,sys
          raw = sys.stdin.read()
          print(os.path.join(os.path.dirname(json.loads(raw)["root"]), "perimeter.yml") if raw.strip() else "(aucun)")'
          }
          registreDePerimeter() { { "$bin" perimeter 2>/dev/null || true; } | head -1 | awk '{print $1}'; }

          poser "$base/xdg/perimeter"
          poser "$base/depot"
          mkdir -p "$base/tour" "$base/depot/sous" "$base/vide" "$base/xdg-vide"
          export XDG_CONFIG_HOME="$base/xdg"
          unset PERIMETER || true

          # Tour de controle : rien en remontee, un registre a l'emplacement
          # utilisateur. C'est le cas exact du rapport.
          cd "$base/tour"
          lint=$(registreDeLint); per=$(registreDePerimeter)
          if [ "$lint" != "$per" ]; then
            echo "::error::registres divergents — lint: $lint / perimeter: $per"; exit 1
          fi
          if [ "$lint" != "$base/xdg/perimeter/perimeter.yml" ]; then
            echo "::error::l'emplacement utilisateur n'a pas ete retenu : $lint"; exit 1
          fi

          # Deux registres repondent : la remontee prime, des deux cotes.
          cd "$base/depot/sous"
          lint=$(registreDeLint); per=$(registreDePerimeter)
          if [ "$lint" != "$per" ]; then
            echo "::error::registres divergents — lint: $lint / perimeter: $per"; exit 1
          fi
          if [ "$lint" != "$base/depot/perimeter.yml" ]; then
            echo "::error::la remontee devait primer sur l'emplacement utilisateur : $lint"; exit 1
          fi

          # Aucun registre : la liste des emplacements cherches, et surtout
          # aucune erreur brute de « open » — c'est la classe de defaut que les
          # diagnostics de premier contact visaient.
          cd "$base/vide"
          set +e
          sortie=$(XDG_CONFIG_HOME="$base/xdg-vide" "$bin" perimeter 2>&1); code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::sans registre, la commande doit echouer"; exit 1
          fi
          for attendu in "aucun perimeter.yml trouve" "PERIMETER" "perctl init"; do
            case "$sortie" in
              *"$attendu"*) ;;
              *) echo "::error::le diagnostic ne cite pas $attendu : $sortie"; exit 1 ;;
            esac
          done
          case "$sortie" in
            *"no such file or directory"*) echo "::error::l'erreur brute de open remonte encore : $sortie"; exit 1 ;;
          esac
          # Le conseil doit designer un moyen qui existe ici : « perimeter » n'a
          # pas de --perimeter, son chemin positionnel etant deja le registre.
          case "$sortie" in
            *--perimeter*) echo "::error::un drapeau absent de cette sous-commande est conseille : $sortie"; exit 1 ;;
          esac

          # Une piste explicite qui ne repond pas se dit, et ne retombe pas en
          # silence sur le registre utilisateur — qui existe pourtant ici.
          cd "$base/tour"
          set +e
          sortie=$(PERIMETER="$base/nexiste-pas.yml" "$bin" perimeter 2>&1); code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::un PERIMETER pointant un fichier absent doit etre signale, pas ignore"; exit 1
          fi
          for attendu in "PERIMETER" "nexiste-pas.yml" "effacer"; do
            case "$sortie" in
              *"$attendu"*) ;;
              *) echo "::error::le message ne cite pas $attendu : $sortie"; exit 1 ;;
            esac
          done
          case "$sortie" in
            *"$base/xdg/perimeter/perimeter.yml"*) echo "::error::retombee silencieuse sur le registre utilisateur : $sortie"; exit 1 ;;
          esac
          echo "  ✓ meme registre que lint dans les deux cas, diagnostic rendu dans les deux autres"

      # « harvest » lit par execution : il doit refuser sans --allow-exec, et
      # ne jamais rien ecrire quand il s'execute. Les deux, pas l'un ou l'autre.
      - name: harvest refuse sans --allow-exec et n'ecrit rien
        run: |
          if ./bin/perctl harvest --perimeter examples/perimeter.yml; then
            echo "::error::harvest aurait du refuser sans --allow-exec"
            exit 1
          fi
          avant=$(git status --porcelain | wc -l)
          ./bin/perctl harvest --perimeter examples/perimeter.yml --allow-exec --limite 3 > /dev/null
          apres=$(git status --porcelain | wc -l)
          if [ "$avant" != "$apres" ]; then
            echo "::error::harvest a modifie l'arbre de travail"
            exit 1
          fi

      # « propose » ne doit jamais rien ecrire sans --write.
      - name: Propose sans effet de bord
        run: |
          avant=$(git status --porcelain examples/ | wc -l)
          ./bin/perctl propose --perimeter examples/perimeter.yml > /dev/null
          apres=$(git status --porcelain examples/ | wc -l)
          if [ "$avant" -ne "$apres" ]; then
            echo "::error::perctl propose a modifie des fichiers sans --write"
            exit 1
          fi
          echo "  ✓ aucun fichier modifie"

      # Le garde-fou d'execution doit refuser une PR venue d'un fork, et
      # accepter le meme corpus hors de ce contexte.
      - name: Garde-fou d'execution
        run: |
          set -euo pipefail
          cat > /tmp/ev.json <<'J'
          {"pull_request":{"head":{"repo":{"full_name":"tiers/perimeter"}}},"repository":{"full_name":"UnPoilTefal/perimeter"}}
          J
          set +e
          GITHUB_ACTIONS=true GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH=/tmp/ev.json \
            ./bin/perctl verify examples/corpus --allow-exec >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::perctl a execute des preuves sur une pull request de fork"
            exit 1
          fi
          echo "  ✓ refus sur une contribution externe (code $code)"

      # « --diff-probes » ne doit rien executer, et ne montrer que les preuves.
      - run: ./bin/perctl verify examples/corpus --diff-probes HEAD

      # Le gabarit d'init doit passer la validation sans retouche.
      - name: Gabarit d'init
        run: |
          tmp=$(mktemp -d)
          ./bin/perctl init --non-interactive -o "$tmp/perimeter.yml"
          ./bin/perctl perimeter "$tmp/perimeter.yml"

      # Le registre d'exemple est la documentation executable du format :
      # roles pourvus et sources sondables.
      - run: ./bin/perctl perimeter examples/perimeter.yml

      # Declarer une sonde n'est pas la passer. Un registre dont une seule
      # sonde echoue doit rendre une sortie ET un code de retour differents du
      # meme registre dont toutes passent — sans corpus, et sans preuve de
      # note. Sans cette garde, « registre coherent » peut decrire un registre
      # dont aucune source ne repond.
      - name: perimeter --probe distingue une sonde cassee
        run: |
          gabarit() {
            cat <<YML
          version: 1
          roles:
            intention.spec:       { source: specs }
            intention.tickets:    { source: tickets }
            contrainte.decisions: { source: adr }
            contrainte.memoire:   { source: memoire }
            etat.declare:         { source: depots }
            etat.reel:            { source: cluster }
          sources:
            specs:   { adapter: files,  reliability: measured, probe: { cmd: "true" } }
            tickets: { adapter: github, reliability: measured, endpoint: "org/produit",
                       probe: { cmd: "echo org/produit", expect_stdout: "^org/produit$" } }
            adr:     { adapter: git,    reliability: declared, probe: { cmd: "true" } }
            memoire: { adapter: files,  reliability: declared, probe: { cmd: "true" } }
            depots:  { adapter: git,    reliability: declared, probe: { cmd: "true" } }
            cluster: { adapter: http,   reliability: measured, probe: { cmd: "$1" } }
          YML
          }
          gabarit true     > /tmp/sain.yml
          gabarit "exit 1" > /tmp/casse.yml

          set +e
          sortieSaine=$(./bin/perctl perimeter /tmp/sain.yml --probe --allow-exec 2>&1); codeSain=$?
          sortieCassee=$(./bin/perctl perimeter /tmp/casse.yml --probe --allow-exec 2>&1); codeCasse=$?
          # Une sonde reste du shell declare dans un fichier de configuration :
          # sans autorisation, on refuse, on ne se tait pas.
          ./bin/perctl perimeter /tmp/sain.yml --probe >/dev/null 2>&1; codeRefus=$?
          set -e

          if [ "$codeSain" -ne 0 ]; then
            echo "::error::toutes les sondes passent, code attendu 0, obtenu $codeSain"
            echo "$sortieSaine"; exit 1
          fi
          if [ "$codeCasse" -eq 0 ]; then
            echo "::error::une sonde en echec doit rendre un code non nul"
            echo "$sortieCassee"; exit 1
          fi
          if [ "$sortieSaine" = "$sortieCassee" ]; then
            echo "::error::sortie identique pour les deux registres — la sonde cassee est invisible"
            exit 1
          fi
          if [ "$codeRefus" -eq 0 ]; then
            echo "::error::les sondes ont ete rejouees sans --allow-exec"
            exit 1
          fi
          echo "  ✓ sain code $codeSain, casse code $codeCasse, refus sans --allow-exec code $codeRefus"

      # La porte s'applique a ses propres exemples. Le verdict attendu est
      # verifie par le code de sortie : 0 produire, 1 instruire, 2 rendre.
      - name: Verdicts de la porte
        run: |
          attendu() {
            local fichier=$1 code=$2; shift 2
            set +e
            ./bin/perctl gate "$fichier" --no-record "$@" >/dev/null
            local obtenu=$?
            set -e
            if [ "$obtenu" -ne "$code" ]; then
              echo "::error file=$fichier::verdict attendu (code $code), obtenu code $obtenu"
              return 1
            fi
            echo "  ✓ $fichier — code $obtenu"
          }
          attendu examples/readiness/prete.yml       0 --corpus examples/corpus
          attendu examples/readiness/a-instruire.yml 1
          attendu examples/readiness/a-rendre.yml    2

  # Le cask est publie pour quatre plateformes. Un appel propre a macOS sans
  # garde d'OS y casse l'installation sous Linux, sans message utile.
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Rendre le cask et verifier ses gardes d'OS
        run: |
          go run github.com/goreleaser/goreleaser/v2@latest release \
            --snapshot --clean --skip=publish,docker >/dev/null
          python3 scripts/cask-guard.py dist/homebrew/Casks/perimeter.rb

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
